name: publish
on:
  push:
    branches: [main]
    paths: ['people/**', 'states/**', 'joint/**', 'inputs/**', 'tools/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m tools.build
      - run: |
          git diff --quiet dist/ && exit 0
          git config user.name "ai-risk-states build"
          git config user.email "actions@users.noreply.github.com"
          git add dist/ && git commit -m "Rebuild dist" && git push
